services:
  paabola:
    build: .
    ports:
      # Host 3001 → container 3000 (f1picks already owns host 3000 on the NAS)
      - "3001:3000"
    volumes:
      # SQLite database persists on the host (NAS) across rebuilds/restarts
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/paabola.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - FOOTBALL_DATA_TOKEN=${FOOTBALL_DATA_TOKEN}
    restart: unless-stopped
